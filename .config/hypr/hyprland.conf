exec = source $HOME/.critical-keys
exec = source $HOME/.env

$terminal = kitty

exec-once = swaybg -i ~/.dotfiles/background.jpg
exec-once = source $HOME/.env && source $HOME/.critical-keys && waybar
exec-once = ~/.config/waybar/monitor.sh daemon
exec-once = dunst
exec-once = hypridle
exec-once = hyprctl setcursor Adwaita 24
exec-once = systemctl --user start plasma-polkit-agent

monitor = eDP-1, preferred, 0x0, 1.2, bitdepth, 8
monitor = , preferred, auto, 1, mirror, eDP-1

bind = SUPER, T, exec, kitty
bind = SUPER, G, exec, google-chrome-stable
bind = SUPER, E, exec, ~/.config/emacs/bin/doom run
bind = SUPER, F, exec, ferdium
bind = SUPER, Q, exec, nautilus
bind = SUPER, N, exec, networkmanager_dmenu
bind = SUPER, I, exec, idea-community
bind = SUPER_SHIFT, I, exec, pkill -f idea-community
bind = SUPER, Return, exec, rofi -show run -show-icons
bind = SUPER, X, killactive, ,
# Lock the screen (hyprlock.conf). Not Ctrl+Alt+L: that is IntelliJ's
# Reformat Code, and binding it here would swallow it.
bind = SUPER, L, exec, pidof hyprlock || hyprlock
bind = SUPER, F10, fullscreen, 1
bind = SUPER_SHIFT, F10, fullscreen, 0
bind = ALT, Tab, workspace, previous
bind = SUPER, Tab, cyclenext, prev
bind = SUPER, Tab, fullscreen, 1
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER_SHIFT, 1, movetoworkspacesilent, 1
bind = SUPER_SHIFT, 2, movetoworkspacesilent, 2
bind = SUPER_SHIFT, 3, movetoworkspacesilent, 3
bind = SUPER_SHIFT, 4, movetoworkspacesilent, 4
bind = SUPER_SHIFT, 5, movetoworkspacesilent, 5
bind = SUPER_SHIFT, 6, movetoworkspacesilent, 6
bind = SUPER_SHIFT, f, togglefloating,
bind = SUPER, B, exec, pkill -f waybar
bind = SUPER_SHIFT, B, exec, source $HOME/.env && source $HOME/.critical-keys && waybar
bindr = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
binde = , XF86AudioRaiseVolume, exec, pulsemixer --change-volume +5 --unmute
binde = , XF86AudioLowerVolume, exec, pulsemixer --change-volume -5 --unmute
bind = , Print, exec, ~/.config/hypr/flameshot.sh
bind = SHIFT, Print, exec, ~/.dotfiles/scripts/screen_record.sh
bind = SUPER_SHIFT, Print, exec, killall -s SIGINT wl-screenrec 
bind = , Control_R, exec, ~/.dotfiles/scripts/toggle_mute.sh

# workaround because arrow keys broke
# bind = , Control_R, sendshortcut, , right,
# bind = SHIFT, Control_R, sendshortcut, SHIFT, right,
# bind = Alt_L, Control_R, sendshortcut, Alt_L, right,
# bind = Control_L, Control_R, sendshortcut, Control_L, right,
# bind = SUPER, Control_R, sendshortcut, , end,

# bind = , ISO_Level3_Shift, sendshortcut, , left,
# bind = SHIFT, ISO_Level3_Shift, sendshortcut, SHIFT, left,
# bind = Alt_L, ISO_Level3_Shift, sendshortcut, Alt_L, left,
# bind = Control_L, ISO_Level3_Shift, sendshortcut, Control_L, left,
# bind = SUPER, ISO_Level3_Shift, sendshortcut, , home,

# bind = SUPER, up, sendshortcut, , page_up,
# bind = SUPER, down, sendshortcut, , page_down,

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Lid closed: screens off, then lock. logind decides separately whether to
# suspend (nix/configurations/hardware.nix): it does, unless the waybar power
# button is cyan (lid-mode.sh holds a handle-lid-switch inhibitor) or an
# external monitor is connected. When it does suspend, it waits for the lock
# (hypridle.conf). dpms goes off first: Hyprland confirms a lock right away
# when no output is on, instead of waiting for a lock frame to render.
bindl = , switch:on:Lid Switch, exec, hyprctl dispatch dpms off; pidof hyprlock || hyprlock
bindl = , switch:off:Lid Switch, exec, hyprctl dispatch dpms on

animation = workspaces, 1, 0.7, default
animation = windows, 0, 0, default

binds {
    allow_workspace_cycles = true
}

general:gaps_in = 2
general:gaps_out = 2

xwayland {
    force_zero_scaling = true
}

input {
    kb_layout = us
    kb_variant = intl
    repeat_rate = 60
    repeat_delay = 220

    kb_options = caps:hyper

    # accel-curve.js 6 8 2
    # FROM ACCELSCRIPT
    accel_profile = custom 0.316 0.000 0.174 0.429 0.726 1.055 1.410 1.676 1.733 1.862 2.062 2.334 2.677 3.092 3.579 4.137 4.766 5.467 6.240 7.084 8.000

    touchpad {
        natural_scroll = yes
        tap-to-click = true
        disable_while_typing = false
    }
}

dwindle {
    preserve_split = yes
}

workspace = w[t1], gapsout:0, gapsin:0, bordersize: 0, rounding:0
workspace = w[tg1], gapsout:0, gapsin:0, bordersize: 0, rounding:0
workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:eDP-1
workspace = 5, monitor:eDP-1
workspace = 6, monitor:eDP-1

windowrule = workspace 1 silent, match:class ^(kitty)$
windowrule = workspace 2 silent, match:class ^(emacs|Emacs)$
windowrule = workspace 3 silent, match:class ^(Google-chrome|google-chrome)
windowrule = workspace 4 silent, match:class ^(Ferdium|ferdium)$
windowrule = workspace 5 silent, match:class ^(org.gnome.Nautilus)$
windowrule = workspace 5 silent, match:class ^(zoom)$
windowrule = workspace 5 silent, match:class ^(Vesktop|vesktop)$
windowrule = workspace 5 silent, match:class ^(lutris)$
windowrule = workspace 5 silent, match:class ^(ECA)$
windowrule = fullscreen on, workspace 5 silent, match:title ^(Godot)$
windowrule = workspace 5 silent, match:class ^(Godot|godot)$
windowrule = workspace 6 silent, match:class ^(Gimp|gimp)$
windowrule = workspace 6 silent, match:class ^(jetbrains-idea-ce)$
windowrule = stay_focused on, match:class ^(pinentry-) # fix pinentry losing focus

# flameshot multi-display fix
windowrule = move 0 0, match:class (flameshot), match:title (flameshot)
windowrule = pin on, match:class (flameshot), match:title (flameshot)
windowrule = fullscreen_state 0 2, match:class (flameshot), match:title (flameshot)
windowrule = float on, match:class (flameshot), match:title (flameshot)

# Per-host overrides (e.g. the built-in panel's mode and scale), written by
# NixOS: `environment.etc."hypr/host.conf"` in nix/hosts/*/default.nix.
# Sourced last so they win (a later `monitor = eDP-1, ...` replaces the one
# above).
source = /etc/hypr/host.conf
