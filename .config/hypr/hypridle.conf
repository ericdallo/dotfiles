# hypridle: lock the session before every sleep. Started by hyprland.conf
# (exec-once), not by NixOS's hypridle unit (see nix/configurations/desktop.nix).
#
# Lid close and Super+L lock directly (hyprland.conf). This covers sleep:
# logind's PrepareForSleep runs before_sleep_cmd, and the Lock signal that
# `loginctl lock-session` triggers runs lock_cmd.
#
# No idle timeouts (listener blocks) on purpose, so its log shows a harmless
# "Config has errors: No rules configured".

general {
    # `pidof` guard: lid close also starts hyprlock straight from
    # hyprland.conf, at the same moment logind starts suspending.
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session

    # Hold a logind "delay" sleep inhibitor until hyprlock reports the
    # session locked (hyprland-lock-notify), so the suspend never happens
    # before the lock screen is up and the desktop never flashes on resume.
    # Auto mode (2) also picks this from the commands above; be explicit.
    inhibit_sleep = 3
}
