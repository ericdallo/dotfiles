# hyprlock: the lock screen. Locks on Super+L and on lid close
# (hyprland.conf), and before every sleep (hypridle.conf). Unlock with the
# account password (the one sudo asks for). Dracula colors, like waybar
# (../waybar/colors.css).
#
# Stuck on it (e.g. the password is not accepted)? From a TTY (Ctrl+Alt+F2),
# log in and run `pkill -USR1 hyprlock`, then go back with Ctrl+Alt+F1.

general {
    hide_cursor = true
}

# Fingerprint through fprintd's D-Bus API, alongside the password (the
# hyprlock PAM service leaves pam_fprintd out: nix/configurations/desktop.nix).
# A no-op on hosts without a reader, like gregnix-s14.
auth {
    fingerprint {
        enabled = true
    }
}

# The same wallpaper swaybg draws (hyprland.conf), darkened and blurred.
background {
    monitor =
    path = ~/.dotfiles/background.jpg
    blur_passes = 2
    brightness = 0.5
}

input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    rounding = 10
    inner_color = rgb(282a36)
    outer_color = rgb(bd93f9)
    check_color = rgb(8be9fd)
    fail_color = rgb(ff5555)
    font_color = rgb(f8f8f2)
    font_family = Hack
    # $FPRINTPROMPT: "(Scan fingerprint to unlock)" where there is a reader.
    placeholder_text = <i>password $FPRINTPROMPT</i>
    fail_text = $FAIL <b>($ATTEMPTS)</b>
    fade_on_empty = false
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(f8f8f2)
    font_size = 64
    font_family = Hack
    position = 0, 60
    halign = center
    valign = center
}
